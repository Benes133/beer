name: Build BeerCrusher VST3

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build with detailed logging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $process = Start-Process -FilePath "cmake" -ArgumentList "--build build --config Release" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "artifacts/build_output.txt" -RedirectStandardError "artifacts/build_error.txt"
          
          Write-Host "=== BUILD ERROR LOG (LAST 80 LINES) ==="
          if (Test-Path "artifacts/build_error.txt") {
            Get-Content "artifacts/build_error.txt" -Tail 80
          }
          
          Write-Host "=== BUILD OUTPUT LOG (LAST 80 LINES) ==="
          if (Test-Path "artifacts/build_output.txt") {
            Get-Content "artifacts/build_output.txt" -Tail 80
          }
          
          if ($process.ExitCode -ne 0) {
            Write-Error "Build failed with exit code $($process.ExitCode)"
            exit $process.ExitCode
          }

      - name: Locate and pack artifacts
        shell: pwsh
        run: |
          Write-Host "Searching for built plugin binaries..."
          $vst3Target = Get-ChildItem -Path "build" -Recurse | Where-Object { $_.Name -like "*.vst3" } | Select-Object -First 1

          if ($vst3Target) {
            Write-Host "Found VST3 at $($vst3Target.FullName)"
            if ($vst3Target.PSIsContainer) {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Recurse -Force
            } else {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Force
            }
          }

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeerCrusher-VST3-Windows
          path: artifacts/
          retention-days: 30
