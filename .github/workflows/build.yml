name: Build BeerCrusher VST3

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate and pack artifacts
        shell: pwsh
        run: |
          Write-Host "Searching for built plugin binaries..."
          Get-ChildItem -Path "build" -Recurse | Where-Object { $_.Name -like "*BeerCrusher*" } | ForEach-Object {
            Write-Host "$($_.FullName)"
          }

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          
          # Find VST3 directory or file
          $vst3Target = Get-ChildItem -Path "build" -Recurse | Where-Object { $_.Name -like "*.vst3" } | Select-Object -First 1

          if ($vst3Target) {
            Write-Host "Found VST3 at $($vst3Target.FullName)"
            if ($vst3Target.PSIsContainer) {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Recurse -Force
            } else {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Force
            }
          } else {
            Write-Warning "VST3 folder not found by extension, looking for Standalone or dlls..."
            Get-ChildItem -Path "build" -Recurse -Filter "*BeerCrusher*.exe" | Copy-Item -Destination "artifacts\"
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeerCrusher-VST3-Windows
          path: artifacts/
          retention-days: 30
