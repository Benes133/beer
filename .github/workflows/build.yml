name: Build BeerCrusher VST3

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Configure CMake ───────────────────────────────────────────────────
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # ── 3. Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── 4. Collect VST3 artifact ─────────────────────────────────────────────
      - name: Collect VST3 artifact
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Filter "*.vst3" -Path "build" | Select-Object -First 1
          if ($null -eq $vst3) {
            Write-Error "No .vst3 file found in build directory!"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          # VST3 bundles are directories on Windows; use robocopy for dir, Copy-Item for file
          if ($vst3.PSIsContainer) {
            robocopy $vst3.FullName "artifacts\$($vst3.Name)" /E /NFL /NDL /NJH /NJS /NC /NS | Out-Null
          } else {
            Copy-Item -Path $vst3.FullName -Destination "artifacts\" -Force
          }
          Write-Host "Collected: $($vst3.FullName)"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeerCrusher-VST3-Windows
          path: artifacts/
          retention-days: 30
