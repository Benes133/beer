name: Build BeerCrusher VST3

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate and pack artifacts
        shell: pwsh
        run: |
          $vst3Target = Get-ChildItem -Path "build" -Recurse | Where-Object { $_.Name -like "*.vst3" } | Select-Object -First 1
          if ($vst3Target) {
            Write-Host "Found VST3 at $($vst3Target.FullName)"
            if ($vst3Target.PSIsContainer) {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Recurse -Force
            } else {
              Copy-Item -Path $vst3Target.FullName -Destination "artifacts\" -Force
            }
          }

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeerCrusher-VST3-Windows
          path: artifacts/
          retention-days: 30
